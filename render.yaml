services:
  - type: web
    name: vida-nova
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    domains:
      - vida-nova.onrender.com

databases:
  - name: vida_nova_db
    databaseName: vida_nova_prod
    user: vida_nova_user
    ipWhitelist:
      - 0.0.0.0/0

envVarGroups:
  - name: production
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromService:
          type: pserv
          property: connectionString
