name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://vidanova-1.onrender.com/api/health || echo "000")
          echo "Status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "Servidor nao respondeu (pode estar acordando)"
          else
            echo "Servidor ok"
          fi
