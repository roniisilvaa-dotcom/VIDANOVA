<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vida Nova</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <h1>Vida Nova Planner</h1>

  <button onclick="openPlanner()">Abrir Planner</button>

  <div id="planner-view" class="hidden">

    <h2>✨ My Planner</h2>

    <div class="planner-header">
      <button>Semanal</button>
      <button>Mensal</button>
    </div>

    <div class="planner-focus">
      <h3>Foco do mês</h3>
      <input placeholder="Meta 1">
      <input placeholder="Meta 2">
    </div>

    <div class="planner-weeks">
      <div contenteditable="true">Semana 1</div>
      <div contenteditable="true">Semana 2</div>
      <div contenteditable="true">Semana 3</div>
      <div contenteditable="true">Semana 4</div>
    </div>

    <textarea placeholder="Reflexão"></textarea>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
