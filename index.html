<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vida Nova</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">VN</div>
      <h1>Vida Nova</h1>
    </div>

    <nav class="sidebar-nav">
      <a href="#" onclick="openPlanner()">Planner</a>
    </nav>
  </aside>

  <main class="main-content">

    <div class="app-topbar">
      <h3>✨ Vida Nova</h3>
    </div>

    <!-- DASHBOARD ORIGINAL MANTIDO -->
    <div id="home-view" class="page-view is-active">
      <div class="panel">
        <h2>Dashboard</h2>
        <p>Seu layout original continua aqui.</p>
      </div>
    </div>

    <!-- NOVO PLANNER SEM QUEBRAR O LAYOUT -->
    <div id="planner-view" class="page-view">

      <div class="panel">
        <h2>📌 Foco do mês</h2>
        <input placeholder="Meta 1">
        <input placeholder="Meta 2">
      </div>

      <div class="panel">
        <h2>📅 Semanas</h2>
        <div class="grid">
          <div class="panel" contenteditable="true">Semana 1</div>
          <div class="panel" contenteditable="true">Semana 2</div>
          <div class="panel" contenteditable="true">Semana 3</div>
          <div class="panel" contenteditable="true">Semana 4</div>
        </div>
      </div>

      <div class="panel">
        <h2>🔔 Resumo</h2>
        <textarea></textarea>
      </div>

    </div>

  </main>
</div>

<script src="script.js"></script>

</body>
</html>
