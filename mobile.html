<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=5" />
    <title>Vida Nova Mobile</title>
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#8fb2f4" />
    <meta name="msapplication-TileColor" content="#8fb2f4" />
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vida Nova" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png?v=nv3" />
    
    <!-- Android Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Windows/Microsoft -->
    <meta name="application-name" content="Vida Nova" />
    <meta name="msapplication-starturl" content="./mobile.html" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.webmanifest?v=nv3" />
    <link rel="icon" href="icon.svg?v=nv3" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png?v=nv3" sizes="192x192" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="mobile-app">
      <section class="mobile-stack">
        <article class="mobile-card" id="mobile-resumo">
          <p class="eyebrow">Resumo principal</p>
          <h2 id="mobile-greeting">Vida Nova</h2>
          <span id="mobile-date-label" class="mobile-date-label"></span>
          <textarea
            id="mobile-summary"
            placeholder="Escreva aqui o resumo do dia, foco principal, observações e prioridades."
          ></textarea>
        </article>

        <article class="mobile-card" id="mobile-agenda">
          <p class="eyebrow">Agenda do dia</p>
          <h2>Compromissos</h2>
          <div class="mobile-row">
            <input id="mobile-time" type="time" aria-label="Horário" />
            <input id="mobile-title" type="text" placeholder="Novo compromisso" aria-label="Compromisso" />
            <button id="mobile-add-event" type="button">Adicionar compromisso</button>
          </div>
          <ul id="mobile-events" class="mobile-list"></ul>
        </article>

        <article class="mobile-card" id="mobile-top10">
          <p class="eyebrow">Lista do dia</p>
          <h2>Top 10 prioridades</h2>
          <div class="mobile-row">
            <input id="mobile-top10-input" type="text" placeholder="Adicionar prioridade" aria-label="Prioridade" />
            <button id="mobile-top10-add" type="button">Adicionar prioridade</button>
          </div>
          <ul id="mobile-top10-list" class="mobile-list"></ul>
        </article>

        <article class="mobile-card" id="mobile-notas">
          <p class="eyebrow">Bloco de anotação</p>
          <h2>Anotações livres</h2>
          <textarea
            id="mobile-notes"
            placeholder="Escreva ideias, lembretes, orações e tudo o que for importante."
          ></textarea>
        </article>
      </section>
    </main>

    <script src="mobile.js"></script>
  </body>
</html>
